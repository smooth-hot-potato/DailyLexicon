<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lexicon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8ECF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11172E" media="(prefers-color-scheme: dark)">
<title>Daily Lexicon</title>
<style>
:root{
  --bg:#E8ECF3; --surface:#F7F8FB; --ink:#18224A; --muted:#566084;
  --accent:#B23A6B; --accent-soft:#F3DCE6; --line:#C9D0DE;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11172E; --surface:#1A2241; --ink:#E8EBF5; --muted:#9BA4C2;
    --accent:#F07AA8; --accent-soft:#3A2141; --line:#2D3760;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.55}
.wrap{max-width:680px; margin:0 auto; padding:24px 20px 48px}

header{margin-bottom:28px}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:40px}
.datebar{justify-content:center; margin-top:18px; padding-top:16px; border-top:1px solid var(--line)}
.savedlink{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.savedlink span[aria-hidden]{color:var(--accent)}
.count{background:var(--accent); color:#fff; border-radius:999px; font-size:.8rem; font-weight:600; min-width:1.5em; padding:0 6px; text-align:center; line-height:1.5}
.brand{font-family:var(--serif); font-size:1.35rem; font-weight:600; margin:0}
.datebar{display:flex; align-items:center; gap:6px}
.date{font-weight:500; color:var(--muted); min-width:8.5em; text-align:center; font-variant-numeric:tabular-nums}
button{
  font:inherit; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
  padding:7px 15px; -webkit-tap-highlight-color:transparent;
}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.35; cursor:default}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.icon{width:40px; height:40px; padding:0; display:grid; place-items:center; font-size:1.2rem}
[hidden]{display:none !important}

.entry{padding:4px 0 34px; border-bottom:1px solid var(--line); margin-bottom:34px}
.entry:last-of-type{border-bottom:none; margin-bottom:0}
.kind{font-size:.95rem; color:var(--accent); font-weight:600; margin:0 0 6px}
.head{font-family:var(--serif); font-weight:600; font-size:clamp(2.3rem, 10vw, 4rem); line-height:1.05; letter-spacing:-.01em; margin:0 0 12px; overflow-wrap:anywhere}
.meta{color:var(--muted); margin:0 0 18px}
.meta em{font-style:italic}
.def{font-size:1.2rem; margin:0 0 22px; max-width:36em}
.example{margin:0 0 16px; padding:18px 20px; background:var(--surface); border-left:4px solid var(--accent); border-radius:0 12px 12px 0; font-family:var(--serif); font-size:1.18rem; line-height:1.6}
.example mark{background:var(--accent-soft); color:inherit; padding:0 3px; border-radius:3px}
.actions{display:flex; gap:8px; flex-wrap:wrap}
.used[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.titlebar{display:flex; align-items:center; gap:10px}
.saved[aria-pressed="true"]{border-color:var(--accent); color:var(--accent)}
.list-item{padding:22px 0; border-bottom:1px solid var(--line)}
.list-item:first-child{padding-top:4px}
.list-item .head{font-size:clamp(1.7rem, 7vw, 2.4rem); margin-bottom:6px}
.list-item .meta{margin-bottom:10px}
.list-item .def{font-size:1.05rem; margin-bottom:14px}
.list-item .example{font-size:1.05rem; padding:12px 16px; margin-bottom:12px}
.empty{color:var(--muted); text-align:center; padding:48px 0}
.filters{display:flex; gap:8px; margin-bottom:18px}
.filters button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
footer{color:var(--muted); font-size:.92rem; margin-top:36px; padding-top:20px; border-top:1px solid var(--line); text-align:center}

.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <div class="titlebar">
        <button class="icon" id="back" aria-label="Back to today" hidden>‹</button>
        <h1 class="brand" id="title">Daily Lexicon</h1>
      </div>
      <button id="savedBtn" class="savedlink"><span aria-hidden="true">★</span> Saved<span class="count" id="savedCount" hidden></span></button>
    </div>
    <div class="datebar" id="datebar">
      <button class="icon" id="prev" aria-label="Previous day">‹</button>
      <span class="date" id="date"></span>
      <button class="icon" id="next" aria-label="Next day">›</button>
      <button id="today" hidden>Today</button>
    </div>
  </header>
  <main id="main"></main>
  <footer id="streak"></footer>
</div>
<script>
const WORDS=[["elated","ih-LAY-tid","adjective","Extremely happy and excited.","She was elated to get the job offer."],["decorum","dih-KOR-um","noun","Proper, polite behavior.","Please maintain decorum during the ceremony."],["deference","DEF-er-ens","noun","Respectful yielding to someone else’s judgment.","In deference to her experience, we followed her plan."],["dormant","DOR-ment","adjective","Temporarily inactive.","The volcano has been dormant for centuries."],["arbitrary","AR-bih-trair-ee","adjective","Based on random choice rather than reason.","The 5 p.m. cutoff seems completely arbitrary."],["lament","luh-MENT","verb","To express sorrow or regret about something.","Everyone laments the loss of the old bookstore."],["ineffable","in-EF-uh-bul","adjective","Too great to be expressed in words.","The view from the summit was ineffable."],["alacrity","uh-LAK-rih-tee","noun","Brisk and cheerful readiness.","She accepted the promotion with alacrity."],["exuberant","ig-ZOO-ber-ent","adjective","Full of energy and excitement.","The exuberant crowd cheered for ten minutes."],["obsequious","ub-SEE-kwee-us","adjective","Excessively eager to please or obey.","The obsequious salesman agreed with everything I said."],["venerable","VEN-er-uh-bul","adjective","Respected because of age or wisdom.","The venerable professor has taught here for forty years."],["pervasive","per-VAY-siv","adjective","Spreading throughout everything.","The smell of smoke was pervasive after the fire."],["rebuke","rih-BYOOK","verb","To sharply criticize someone.","The coach rebuked the players for being late."],["efficacy","EF-ih-kuh-see","noun","The ability to produce the intended result.","Studies question the efficacy of that supplement."],["quandary","KWON-duh-ree","noun","A state of uncertainty about what to do.","I’m in a quandary about which job offer to accept."],["incongruous","in-KONG-groo-us","adjective","Out of place; not fitting in.","A tuxedo at a beach barbecue looks incongruous."],["replete","rih-PLEET","adjective","Filled or well supplied.","The report is replete with typos."],["palpable","PAL-puh-bul","adjective","So intense it can almost be felt.","The tension in the room was palpable."],["synergy","SIN-er-jee","noun","Combined effect greater than the parts alone.","There’s real synergy between the design and sales teams."],["elicit","ih-LIS-it","verb","To draw out a response or reaction.","The joke elicited a few polite laughs."],["nostalgia","nos-TAL-juh","noun","A sentimental longing for the past.","That old song fills me with nostalgia."],["wane","WAYN","verb","To decrease gradually.","Interest in the show began to wane after season two."],["meander","mee-AN-der","verb","To wander aimlessly.","We meandered through the market all afternoon."],["impeccable","im-PEK-uh-bul","adjective","Flawless.","Her timing was impeccable; she arrived just as dinner was served."],["conundrum","kuh-NUN-drum","noun","A confusing and difficult problem.","Taking the higher salary or the better team is a real conundrum."],["expedient","ik-SPEE-dee-ent","adjective","Convenient and practical, though possibly not right.","It was expedient to blame the intern."],["perpetuate","per-PECH-oo-ayt","verb","To make something continue indefinitely.","Jokes like that perpetuate stereotypes."],["obfuscate","OB-fuh-skayt","verb","To make something unclear, often on purpose.","The contract’s jargon seems designed to obfuscate the fees."],["guile","GYLE","noun","Clever but sly intelligence.","He used guile, not strength, to win the negotiation."],["insurmountable","in-ser-MOWN-tuh-bul","adjective","Too great to overcome.","The problem seemed insurmountable at first."],["ludicrous","LOO-dih-krus","adjective","So unreasonable it’s laughable.","Paying $12 for a bottle of water is ludicrous."],["zeitgeist","ZYTE-gyste","noun","The defining spirit or mood of a period of time.","That song perfectly captured the zeitgeist of the early 2000s."],["exonerate","ig-ZON-uh-rayt","verb","To officially clear someone of blame.","The video evidence exonerated him."],["proponent","pruh-POH-nent","noun","Someone who argues in favor of something.","She’s a strong proponent of remote work."],["kudos","KOO-dohz","noun","Praise for an achievement.","Kudos to the team for finishing early."],["scrutinize","SKROO-tih-nyze","verb","To examine closely.","Always scrutinize the fine print."],["plethora","PLETH-er-uh","noun","A large or excessive amount.","There’s a plethora of streaming services now."],["ascertain","as-er-TAYN","verb","To find out for certain.","We need to ascertain who approved the order."],["condescending","kon-dih-SEN-ding","adjective","Acting as if you’re superior to others.","His condescending tone made everyone tune out."],["holistic","hoh-LIS-tik","adjective","Considering the whole rather than just the parts.","The school takes a holistic view of each student."],["lackadaisical","lak-uh-DAY-zih-kul","adjective","Lacking enthusiasm and effort.","His lackadaisical attitude cost us the game."],["pivotal","PIV-uh-tul","adjective","Of crucial importance.","That meeting was a pivotal moment in my career."],["indelible","in-DEL-ih-bul","adjective","Impossible to forget or remove.","The trip left an indelible impression on me."],["indignant","in-DIG-nent","adjective","Angry at something that seems unfair.","She was indignant when they accused her of cheating."],["frugal","FROO-gul","adjective","Careful with money; economical.","Being frugal helped them buy a house early."],["potent","POH-tent","adjective","Very powerful or effective.","That coffee is potent."],["concede","kun-SEED","verb","To admit something is true, often reluctantly.","I’ll concede that your route was faster."],["exorbitant","ig-ZOR-bih-tent","adjective","Unreasonably high, especially in price.","The concert tickets were exorbitant."],["inadvertent","in-ad-VUR-tent","adjective","Not intentional; accidental.","I inadvertently hit reply-all."],["gregarious","grih-GAIR-ee-us","adjective","Fond of company; sociable.","My gregarious uncle knows everyone at the party within an hour."],["exasperate","ig-ZAS-per-ayt","verb","To intensely irritate.","His constant interruptions exasperated everyone."],["inundate","IN-un-dayt","verb","To overwhelm with a large amount of something.","We were inundated with applications."],["compliant","kum-PLY-ent","adjective","Following rules or requests.","The new software is compliant with privacy laws."],["colloquial","kuh-LOH-kwee-ul","adjective","Used in casual, everyday conversation.","“Gonna” is colloquial, so avoid it in your cover letter."],["insidious","in-SID-ee-us","adjective","Spreading harm gradually and quietly, so it’s hard to notice.","Scope creep is insidious; a few small requests later, the project has doubled."],["lethargic","luh-THAR-jik","adjective","Sluggish and lacking energy.","I always feel lethargic after a big lunch."],["polarizing","POH-luh-ry-zing","adjective","Causing sharp division into opposing groups.","The new logo was polarizing; people loved or hated it."],["antithesis","an-TITH-uh-sis","noun","The direct opposite of something.","His messy desk is the antithesis of her minimalist style."],["debacle","dih-BAH-kul","noun","A sudden, embarrassing failure.","The product launch was a debacle; the website crashed in minutes."],["rationale","rash-uh-NAL","noun","The reasons behind a decision.","Can you explain the rationale for the price increase?"],["rectify","REK-tih-fy","verb","To fix or correct.","We’ll rectify the billing error right away."],["extraneous","ik-STRAY-nee-us","adjective","Not relevant; extra.","Remove any extraneous details from the summary."],["perseverance","pur-suh-VEER-ens","noun","Continued effort despite difficulty.","Learning an instrument takes perseverance."],["benign","bih-NYNE","adjective","Gentle and harmless.","The warning light turned out to be benign; just a loose sensor."],["quintessential","kwin-teh-SEN-shul","adjective","The most perfect or typical example of something.","Fish and chips by the sea is the quintessential British summer meal."],["incumbent","in-KUM-bent","noun","The current holder of a position.","The incumbent mayor is running for a third term."],["paramount","PAIR-uh-mownt","adjective","More important than anything else.","Safety is paramount on a construction site."],["mercurial","mer-KYOOR-ee-ul","adjective","Changing mood quickly and unpredictably.","Our mercurial boss can go from cheerful to furious in seconds."],["coalesce","koh-uh-LES","verb","To come together into one whole.","Slowly, the ideas coalesced into a real business plan."],["reciprocate","rih-SIP-ruh-kayt","verb","To respond with a similar action or feeling.","They helped us move, so we’ll reciprocate next month."],["emulate","EM-yuh-layt","verb","To imitate someone you admire.","Young players often emulate their favorite athletes."],["magnitude","MAG-nih-tood","noun","Great size or importance.","We didn’t realize the magnitude of the problem."],["digress","dy-GRES","verb","To wander off the main topic.","Sorry, I digress; back to the budget."],["rudimentary","roo-dih-MEN-tuh-ree","adjective","Basic; at an early stage.","I have only a rudimentary knowledge of Spanish."],["banal","buh-NAL","adjective","So ordinary that it’s boring.","The movie’s plot was banal, but the acting was great."],["pragmatic","prag-MAT-ik","adjective","Dealing with things sensibly and realistically.","Let’s take a pragmatic approach and fix the urgent problems first."],["verbose","ver-BOHS","adjective","Using more words than needed.","The report is useful but verbose; it could be half the length."],["cajole","kuh-JOHL","verb","To persuade someone with gentle flattery or coaxing.","We cajoled him into singing at the party."],["gauche","GOHSH","adjective","Socially awkward or tactless.","Asking how much she paid for the house felt gauche."],["implicit","im-PLIS-it","adjective","Implied rather than directly stated.","There was an implicit expectation that we’d work late."],["demeanor","dih-MEE-ner","noun","Outward behavior or manner.","Her calm demeanor reassured the nervous patients."],["blatant","BLAY-tent","adjective","Done openly and without shame.","That was a blatant lie."],["diffident","DIF-ih-dent","adjective","Shy and lacking self-confidence.","He was diffident at first but opened up later."],["dichotomy","dy-KOT-uh-mee","noun","A division into two contrasting things.","There’s a false dichotomy between being kind and being successful."],["vexing","VEK-sing","adjective","Annoying and puzzling.","The Wi-Fi problem is vexing; it drops every hour."],["denigrate","DEN-ih-grayt","verb","To criticize unfairly; to belittle.","Don’t denigrate other people’s work to make yours look better."],["astute","uh-STOOT","adjective","Sharp at noticing things and using them to your advantage.","That’s an astute observation; prices went up right after the competitor closed."],["pedantic","peh-DAN-tik","adjective","Overly concerned with minor details or rules.","Correcting his grammar during a eulogy was pedantic."],["impasse","IM-pas","noun","A situation where no progress is possible.","Negotiations reached an impasse."],["idiosyncratic","id-ee-oh-sin-KRAT-ik","adjective","Peculiar or unique to a particular person.","His idiosyncratic habit of reading the last page first drives me crazy."],["vindictive","vin-DIK-tiv","adjective","Wanting revenge.","His vindictive reviews targeted anyone who criticized him."],["empathy","EM-puh-thee","noun","The ability to understand and share others’ feelings.","Good nurses have a lot of empathy."],["resolute","REZ-uh-loot","adjective","Determined and unwavering.","She remained resolute despite the criticism."],["petulant","PECH-uh-lent","adjective","Childishly sulky or bad-tempered.","He gave a petulant shrug when he lost the coin toss."],["anachronism","uh-NAK-ruh-niz-um","noun","Something that seems to belong to a different time.","In a world of streaming, a video rental store feels like an anachronism."],["concise","kun-SYSE","adjective","Brief but complete.","Keep your answer concise; we only have five minutes."],["usurp","yoo-SURP","verb","To take power or a position wrongfully.","The new app could usurp the old favorite."],["arduous","AR-joo-us","adjective","Difficult and tiring.","The last mile of the hike was arduous but worth it."],["empirical","em-PEER-ih-kul","adjective","Based on observation or experiment rather than theory.","We need empirical evidence, not just opinions."],["panacea","pan-uh-SEE-uh","noun","A supposed cure for all problems.","More meetings aren’t a panacea for poor communication."],["inexorable","in-EK-ser-uh-bul","adjective","Impossible to stop or prevent.","The inexorable rise in rent is pushing artists out of the neighborhood."],["vitriol","VIT-ree-ul","noun","Cruel and bitter criticism.","The comment section was full of vitriol."],["comprehensive","kom-prih-HEN-siv","adjective","Including everything; complete.","We need a comprehensive plan, not quick fixes."],["elusive","ih-LOO-siv","adjective","Hard to find, catch, or achieve.","A good night’s sleep has been elusive since the baby arrived."],["cogent","KOH-jent","adjective","Clear, logical, and convincing.","You made a cogent case for changing the schedule."],["skeptical","SKEP-tih-kul","adjective","Doubtful; not easily convinced.","I’m skeptical of any diet that bans fruit."],["redundant","rih-DUN-dent","adjective","No longer needed; unnecessarily repetitive.","Saying “free gift” is redundant."],["fallacy","FAL-uh-see","noun","A mistaken belief or flawed argument.","It’s a fallacy that you need to be loud to be a leader."],["tenacious","teh-NAY-shus","adjective","Determined; not giving up easily.","She was tenacious enough to apply four times before she got the job."],["tangible","TAN-juh-bul","adjective","Real and concrete; able to be touched.","We need tangible results, not promises."],["tangential","tan-JEN-shul","adjective","Only slightly related to the main topic.","That’s a tangential issue; let’s finish the budget first."],["preemptive","pree-EMP-tiv","adjective","Done to prevent something expected.","I sent a preemptive apology before the meeting."],["quaint","KWAYNT","adjective","Charmingly old-fashioned.","We stayed in a quaint cottage by the sea."],["indolent","IN-duh-lent","adjective","Lazy; avoiding effort.","Sunday afternoons make me pleasantly indolent."],["tacit","TAS-it","adjective","Understood without being said.","There was a tacit agreement not to mention the divorce."],["vacillate","VAS-ih-layt","verb","To keep changing your mind.","I keep vacillating between the blue and the green."],["hackneyed","HAK-need","adjective","Overused and unoriginal.","The speech was full of hackneyed phrases like “think outside the box.”"],["intrinsic","in-TRIN-sik","adjective","Belonging naturally; essential.","The painting’s intrinsic value is low, but it means a lot to me."],["terse","TURS","adjective","Abrupt and using few words, sometimes rudely.","Her terse email made it clear she was annoyed."],["caustic","KAW-stik","adjective","Sharply critical or sarcastic.","Her caustic review of the restaurant went viral."],["procrastinate","proh-KRAS-tih-nayt","verb","To delay doing something.","I procrastinated on my taxes until the last day."],["pernicious","per-NISH-us","adjective","Harmful in a gradual or subtle way.","Constant comparison on social media has a pernicious effect on self-esteem."],["lucid","LOO-sid","adjective","Clear and easy to understand.","Her explanation was so lucid that I finally understood compound interest."],["tedious","TEE-dee-us","adjective","Long, slow, and boring.","Filling out expense reports is tedious."],["subjective","sub-JEK-tiv","adjective","Based on personal feelings or opinions.","Taste in music is subjective."],["innate","ih-NAYT","adjective","Inborn; natural.","She has an innate sense of rhythm."],["conscientious","kon-shee-EN-shus","adjective","Careful to do things well and thoroughly.","She’s Shortness, especially in speaking or writing.","I appreciated the brevity of the meeting."],["provocative","pruh-VOK-uh-tiv","adjective","Intended to provoke a reaction.","The ad was deliberately provocative."],["paradigm","PAIR-uh-dyme","noun","A typical model or pattern; a framework for thinking.","Remote work shifted the paradigm of what an office is even for."],["precarious","prih-KAIR-ee-us","adjective","Unstable and dangerous.","The stack of dishes looked precarious."],["nefarious","nih-FAIR-ee-us","adjective","Wicked or criminal, often with a hint of scheming.","That free charger at the airport might have a nefarious purpose, like stealing your data."],["laconic","luh-KON-ik","adjective","Using very few words.","His laconic reply, just “Fine,” told me he wasn’t happy."],["chagrin","shuh-GRIN","noun","Annoyance or embarrassment at failing.","To my chagrin, I forgot her name mid-sentence."],["capricious","kuh-PRISH-us","adjective","Changing mood or behavior suddenly and unpredictably.","The capricious weather turned our picnic into a dash for cover."],["cognizant","KOG-nih-zent","adjective","Aware of something.","We’re cognizant of the deadline and working on it."],["ambivalent","am-BIV-uh-lent","adjective","Having mixed feelings about something.","I’m ambivalent about moving; I’d love the space, but I’d miss my friends."],["heinous","HAY-nus","adjective","Shockingly evil.","The crime was heinous."],["allude","uh-LOOD","verb","To refer to something indirectly.","She alluded to some changes coming next year."],["lucrative","LOO-kruh-tiv","adjective","Producing a lot of profit.","Flipping houses can be lucrative but risky."],["affable","AF-uh-bul","adjective","Friendly and easy to talk to.","The new neighbor is affable and always stops to chat."],["euphemism","YOO-fuh-miz-um","noun","A mild word used in place of a harsh one.","“Let go” is a euphemism for “fired.”"],["aggrandize","uh-GRAN-dyze","verb","To make something seem greater than it is.","He tends to aggrandize his role in the project."],["presumptuous","prih-ZUMP-choo-us","adjective","Overstepping boundaries by assuming too much.","It was presumptuous of him to invite himself."],["assiduous","uh-SIJ-oo-us","adjective","Showing great care and persistence.","Her assiduous preparation is why the pitch went so smoothly."],["litany","LIT-uh-nee","noun","A long, repetitive list.","He gave a litany of excuses for being late."],["pompous","POMP-us","adjective","Self-important and arrogant.","The pompous speaker kept mentioning his awards."],["perfunctory","per-FUNK-tuh-ree","adjective","Done with minimal effort, just to get it over with.","He gave a perfunctory apology and went back to his phone."],["clandestine","klan-DES-tin","adjective","Kept secret, often because it’s illicit.","They held clandestine meetings to plan the surprise party."],["meticulous","meh-TIK-yoo-lus","adjective","Showing great attention to detail.","She’s meticulous about her notes, so ask her what was decided."],["tenuous","TEN-yoo-us","adjective","Very weak or slight.","The link between the two events is tenuous at best."],["sporadic","spuh-RAD-ik","adjective","Happening irregularly.","We get sporadic updates from the contractor."],["candid","KAN-did","adjective","Truthful and straightforward.","Can I be candid with you about the proposal?"],["equivocate","ih-KWIV-uh-kayt","verb","To use vague language to avoid committing to an answer.","Stop equivocating; are you coming or not?"],["egregious","ih-GREE-jus","adjective","Shockingly bad; far worse than normal.","Charging $40 for parking at a hospital is egregious."],["gravitas","GRAV-ih-tahs","noun","Seriousness and dignity that earns respect.","She speaks with real gravitas in meetings."],["transparent","trans-PAIR-ent","adjective","Open and honest, without hidden motives.","The company is transparent about its pricing."],["cynical","SIN-ih-kul","adjective","Believing people are motivated mainly by self-interest.","I’m cynical about celebrity charity campaigns."],["sardonic","sar-DON-ik","adjective","Mocking in a grimly humorous way.","She gave a sardonic laugh when the printer jammed again."],["ingenious","in-JEEN-yus","adjective","Clever, original, and inventive.","Using a shoe rack for cleaning supplies is ingenious."],["salient","SAY-lee-ent","adjective","Most noticeable or important.","Just give me the salient points; I’ll read the full report later."],["infallible","in-FAL-uh-bul","adjective","Incapable of making mistakes.","GPS isn’t infallible; it once sent me into a lake."],["fervent","FUR-vent","adjective","Having intense passion.","She’s a fervent supporter of local farmers."],["incisive","in-SY-siv","adjective","Sharp, clear, and direct in thinking.","Her incisive questions exposed the plan’s flaws."],["hypocrisy","hih-POK-ruh-see","noun","Claiming standards you don’t follow yourself.","Lecturing us about phones while texting was pure hypocrisy."],["temerity","tuh-MAIR-ih-tee","noun","Excessive boldness; nerve.","He had the temerity to ask for a raise after missing the deadline."],["trivialize","TRIV-ee-uh-lyze","verb","To make something seem less important than it is.","Don’t trivialize her concerns."],["innuendo","in-yoo-EN-doh","noun","A hint or remark that suggests something, often negative.","The article was full of innuendo but no facts."],["debilitating","dih-BIL-ih-tay-ting","adjective","Seriously weakening.","Migraines can be debilitating."],["tirade","TY-rayd","noun","A long, angry speech.","He launched into a tirade about parking fees."],["adversity","ad-VUR-sih-tee","noun","Difficulty or misfortune.","She showed real strength in the face of adversity."],["detrimental","det-rih-MEN-tul","adjective","Causing harm.","Skipping breakfast can be detrimental to your focus."],["indifferent","in-DIF-er-ent","adjective","Having no interest or concern.","The cat was indifferent to its expensive new bed."],["exemplary","ig-ZEM-pluh-ree","adjective","So good it serves as an example.","Her attendance ace two things side by side to highlight a contrast.","The film juxtaposes the glamour of the city with the quiet of the countryside."],["rhetoric","RET-er-ik","noun","Persuasive language, sometimes lacking substance.","Voters are tired of empty rhetoric."],["apprehensive","ap-rih-HEN-siv","adjective","Anxious that something bad will happen.","I’m apprehensive about the job interview."],["bolster","BOHL-ster","verb","To support or strengthen.","The good reviews bolstered her confidence."],["delineate","dih-LIN-ee-ayt","verb","To describe or outline precisely.","The contract clearly delineates who pays for repairs."],["pertinent","PER-tih-nent","adjective","Relevant to the matter at hand.","That’s a pertinent question; let’s come back to it after the break."],["utilitarian","yoo-til-ih-TAIR-ee-un","adjective","Designed to be useful rather than attractive.","The kitchen is utilitarian, but it works."],["remorse","rih-MORS","noun","Deep regret for doing something wrong.","He showed no remorse for breaking the vase."],["disparate","DIS-per-it","adjective","Very different from each other; not easily compared.","The team pulled together data from a dozen disparate sources."],["pristine","pris-TEEN","adjective","In perfect, untouched condition.","The vintage car was in pristine condition."],["philanthropy","fih-LAN-thruh-pee","noun","Generous giving to help others.","She devotes her retirement to philanthropy."],["futile","FYOO-tul","adjective","Pointless; having no chance of success.","Arguing with the parking meter is futile."],["prosaic","proh-ZAY-ik","adjective","Ordinary and unimaginative.","The real reason for the delay was prosaic: a flat tire."],["ameliorate","uh-MEEL-yuh-rayt","verb","To make something bad better.","New streetlights helped ameliorate safety concerns in the park."],["diverge","dy-VURJ","verb","To separate and go in different directions.","Our opinions diverge on this issue."],["expedite","EK-spih-dyte","verb","To speed up a process.","Can we expedi ible danger.","I’m wary of deals that seem too good to be true."],["reverence","REV-er-ens","noun","Deep respect.","They spoke of their grandmother with reverence."],["resilient","rih-ZIL-yent","adjective","Able to recover quickly from difficulty.","Kids are resilient; she’ll settle into the new school soon."],["iconoclast","eye-KON-uh-klast","noun","Someone who attacks established beliefs.","The chef is an iconoclast who serves dessert first."],["surreptitious","sur-ep-TISH-us","adjective","Done secretly to avoid notice.","He took a surreptitious glance at his phone during the meeting."],["impervious","im-PUR-vee-us","adjective","Not affected or influenced by something.","He seems impervious to criticism."],["proficient","pruh-FISH-ent","adjective","Skilled and competent.","She’s proficient in three languages."],["substantiate","sub-STAN-shee-ayt","verb","To provide evidence to support a claim.","Can you substantiate that accusation?"],["preposterous","prih-POS-ter-us","adjective","Completely absurd.","The idea that he’d quit over a parking spot is preposterous."],["vernacular","ver-NAK-yuh-ler","noun","The everyday language of a group or region.","“Y’all” is part of the Southern vernacular."],["eclectic","ih-KLEK-tik","adjective","Drawing from a wide variety of sources or styles.","His music taste is eclectic: jazz, metal, and country."],["discretion","dih-SKRESH-un","noun","The freedom to decide; also, careful handling of private matters.","Please use discretion; this information is confidential."],["cacophony","kuh-KOF-uh-nee","noun","A harsh mix of loud sounds.","Morning traffic is a cacophony of horns and sirens."],["ambiguous","am-BIG-yoo-us","adjective","Open to more than one interpretation.","The text was ambiguous; was she joking or not?"],["ostracize","OS-truh-syze","verb","To exclude someone from a group.","He was ostracized after leaking the group chat."],["unscrupulous","un-SKROO-pyuh-lus","adjective","Without moral principles; dishonest.","Unscrupulou al issue; let’s stick to the main problem."],["lenient","LEE-nee-ent","adjective","More forgiving than expected.","The teacher was lenient about late homework."],["rampant","RAM-pent","adjective","Spreading uncontrollably.","Rumors were rampant after the CEO left."],["plausible","PLAW-zih-bul","adjective","Seeming reasonable or probable.","His excuse was plausible, so we let it go."],["disseminate","dih-SEM-ih-nayt","verb","To spread information widely.","We need to disseminate the new policy to all staff."],["frivolous","FRIV-uh-lus","adjective","Not serious; lacking importance.","The judge dismissed the frivolous lawsuit."],["belligerent","buh-LIJ-er-ent","adjective","Hostile and eager to fight.","The belligerent customer was asked to leave."],["benchmark","BENCH-mark","noun","A standard used for comparison.","Last year’s sales are our benchmark."],["sycophant","SIK-uh-fant","noun","Someone who flatters powerful people to gain advantage.","The CEO surrounded himself with sycophants."],["onerous","OH-ner-us","adjective","Burdensome; involving heavy effort.","The paperwork for the permit is onerous."],["wistful","WIST-ful","adjective","Having a gentle, sad longing.","She gave a wistful look at the old photos."],["inherent","in-HEER-ent","adjective","Existing as a natural, permanent part of something.","There’s an inherent risk in starting a business."],["indispensable","in-dih-SPEN-suh-bul","adjective","Absolutely necessary.","A good map is indispensable on this hike."],["chronic","KRON-ik","adjective","Persisting for a long time or constantly recurring.","He has a chronic habit of arriving late."],["trepidation","trep-ih-DAY-shun","noun","Fear or anxiety about what may happen.","I opened the email with some trepidation."],["alleviate","uh-LEE-vee-ayt","verb","To make pain or a problem less severe.","Hiring one more person would alleviate a lot of pressure on the team."],["enigmatic","en-ig-MAT-ik","adjective","Mysterious and hard to understand.","She gave an enigmatic smile and said nothing."],["anomaly","uh-NOM-uh-lee","noun","Something that deviates from what’s normal.","The low score was an anomaly; she usually aces tests."],["discerning","dih-SUR-ning","adjective","Having good judgment and taste.","The restaurant caters to discerning diners."],["predicament","prih-DIK-uh-ment","noun","A difficult or awkward situation.","Locking my keys in the car put me in a predicament."],["cliché","klee-SHAY","noun","An overused phrase or idea.","“It is what it is” has become a cliché."],["credence","KREE-dens","noun","Belief in or acceptance of something as true.","The new study gives credence to her theory."],["consensus","kun-SEN-sus","noun","General agreement among a group.","We reached a consensus on the venue after an hour."],["rapport","ra-POR","noun","A friendly, understanding relationship.","She quickly built rapport with the new clients."],["altruistic","al-troo-IS-tik","adjective","Unselfishly concerned for others.","Donating a kidney to a stranger is about as altruistic as it gets."],["facilitate","fuh-SIL-ih-tayt","verb","To make something easier.","A shared calendar would facilitate planning."],["optimal","OP-tih-mul","adjective","Best or most favorable.","The optimal time to visit is early spring."],["nonplussed","non-PLUST","adjective","So surprised and confused you don’t know how to react.","I was nonplussed when he proposed on the first date."],["superfluous","soo-PER-floo-us","adjective","Unnecessary; more than is needed.","Cut the superfluous slides and the talk will be much stronger."],["jeopardize","JEP-er-dyze","verb","To put something at risk.","Missing the deadline could jeopardize the whole deal."],["contentious","kun-TEN-shus","adjective","Likely to cause disagreement.","Parking is a contentious issue in our building."],["reprehensible","rep-rih-HEN-sih-bul","adjective","Deserving strong criticism.","Lying to customers is reprehensible."],["corroborate","kuh-ROB-uh-rayt","verb","To confirm or support with evidence.","Two witnesses corroborated his story."],["commensurate","kuh-MEN-ser-it","adjective","In proportion to; matching in size or degree.","Pay should be commensurate with experience."],["impetuous","im-PECH-oo-us","adjective","Acting quickly without thinking.","Buying a boat was an impetuous decision."],["dubious","DOO-bee-us","adjective","Doubtful or suspicious.","I’m dubious about any investment that promises 30% returns."],["eminent","EM-ih-nent","adjective","Famous and respected in a field.","An eminent scientist will speak at graduation."],["prolific","pruh-LIF-ik","adjective","Producing a lot of work.","He’s a prolific writer with forty books."],["epiphany","ih-PIF-uh-nee","noun","A sudden moment of realization.","I had an epiphany in the shower about how to fix the bug."],["contrite","kun-TRYTE","adjective","Feeling sincere regret.","He looked genuinely contrite after missing her birthday."],["mitigate","MIT-ih-gayt","verb","To make something bad less severe, serious, or painful.","We added a second server to mitigate the risk of the site going down."],["meritocracy","mair-ih-TOK-ruh-see","noun","A system where people advance based on ability.","The company claims to be a meritocracy."],["audacious","aw-DAY-shus","adjective","Bold and daring, sometimes shockingly so.","Asking for a raise on your first day is audacious."],["charisma","kuh-RIZ-muh","noun","Compelling charm that inspires others.","She has the charisma to fill a room."],["perennial","puh-REN-ee-ul","adjective","Lasting or recurring year after year.","Traffic is a perennial complaint in this city."],["notorious","noh-TOR-ee-us","adjective","Famous for something bad.","This intersection is notorious for accidents."],["epitome","ih-PIT-uh-mee","noun","A perfect example of a quality or type.","That hotel is the epitome of luxury."],["hypothetical","hy-puh-THET-ih-kul","adjective","Based on an imagined situation.","Just as a hypothetical, what would you do with a million dollars?"],["complicit","kum-PLIS-it","adjective","Involved with others in wrongdoing.","Staying silent made him complicit in the cover-up."],["visceral","VIS-er-ul","adjective","Felt deeply and instinctively, rather than intellectually.","I had a visceral reaction to the smell."],["nonchalant","non-shuh-LAHNT","adjective","Casually calm and unconcerned.","He was nonchalant about missing his flight."],["mundane","mun-DAYN","adjective","Ordinary and dull.","Even mundane chores feel better with music on."],["superficial","soo-per-FISH-ul","adjective","Shallow; only on the surface.","The repairs were superficial; the real problem remains."],["magnanimous","mag-NAN-ih-mus","adjective","Generous and forgiving, especially toward a rival.","He was magnanimous in defeat and congratulated the winner first."],["bombastic","bom-BAS-tik","adjective","Full of pompous, inflated language.","His bombastic speech promised to change the world."],["refute","rih-FYOOT","verb","To prove a statement wrong.","The data refutes the claim that sales are down."],["catalyst","KAT-uh-list","noun","Something that causes an important change.","Losing that client was the catalyst for rethinking our whole strategy."],["haughty","HAW-tee","adjective","Arrogantly superior.","The haughty waiter looked down at our wine choice."],["deleterious","del-ih-TEER-ee-us","adjective","Causing harm or damage.","Too much screen time can have deleterious effects on sleep."],["hierarchy","HY-er-ar-kee","noun","A ranking system from top to bottom.","The company has a flat hierarchy with few managers."],["insinuate","in-SIN-yoo-ayt","verb","To suggest something unpleasant indirectly.","Are you insinuating that I ate the last cookie?"],["myopic","my-OP-ik","adjective","Short-sighted; lacking long-term thinking.","Cutting the training budget is a myopic decision."],["serendipity","ser-en-DIP-ih-tee","noun","Finding something good by happy chance.","Meeting my business partner at a random dinner was pure serendipity."],["staunch","STAWNCH","adjective","Loyal and committed.","She’s a staunch supporter of the local team."],["mediocre","mee-dee-OH-ker","adjective","Only average; not very good.","The food was mediocre, but the view was amazing."],["infamous","IN-fuh-mus","adjective","Well known for a bad reason.","The infamous traffic jam lasted eleven hours."],["negligent","NEG-lih-jent","adjective","Failing to take proper care.","The landlord was negligent in fixing the stairs."],["pugnacious","pug-NAY-shus","adjective","Eager to argue or fight.","The pugnacious host interrupted every guest."],["intuitive","in-TOO-ih-tiv","adjective","Easy to understand without explanation; based on instinct.","The app’s design is so intuitive that my grandma uses it."],["obstinate","OB-stih-nit","adjective","Stubbornly refusing to change your mind.","My obstinate grandfather won’t use a smartphone."],["transient","TRAN-zee-ent","adjective","Lasting only a short time.","The side effects are mild and transient."],["despondent","dih-SPON-dent","adjective","In low spirits from loss of hope.","He was despondent after the team lost the final."],["galvanize","GAL-vuh-nyze","verb","To shock or excite someone into action.","The storm damage galvanized the neighborhood to organize."],["nascent","NAY-sent","adjective","Just beginning to develop.","The nascent startup has only three employees."],["impromptu","im-PROMP-too","adjective","Done without preparation.","We had an impromptu dance party in the kitchen."],["callous","KAL-us","adjective","Insensitive to the feelings of others.","Laughing at her bad news was callous."],["melancholy","MEL-un-kol-ee","noun","A deep, quiet sadness.","There’s a sweet melancholy to the last day of summer."],["voracious","vuh-RAY-shus","adjective","Having a huge appetite for something.","She’s a voracious reader, finishing two books a week."],["discrepancy","dih-SKREP-un-see","noun","A difference between things that should match.","There’s a discrepancy between the receipt and my bank statement."],["succinct","suk-SINKT","adjective","Briefly and clearly expressed.","Give me a succinct summary in two sentences."],["didactic","dy-DAK-tik","adjective","Intended to teach, sometimes in a preachy way.","The movie felt too didactic, like a lecture."],["facetious","fuh-SEE-shus","adjective","Joking at an inappropriate time.","I was being facetious when I said I’d quit."],["prerogative","prih-ROG-uh-tiv","noun","A right or privilege belonging to someone.","It’s your prerogative to change your mind."],["paltry","PAWL-tree","adjective","Small and meaningless.","They offered a paltry 1% raise."],["embellish","em-BEL-ish","verb","To make a story more interesting by adding details, often untrue.","He tends to embellish his fishing stories."],["complacent","kum-PLAY-sent","adjective","Too satisfied with yourself to notice danger or keep improving.","We’ve been winning, but we can’t get complacent."],["sabotage","SAB-uh-tahzh","verb","To deliberately undermine something.","Staying up late will sabotage your morning workout."],["vicarious","vy-KAIR-ee-us","adjective","Experienced through someone else.","I get vicarious thrills from my sister’s travel photos."],["untenable","un-TEN-uh-bul","adjective","Impossible to defend or maintain.","Working three jobs became untenable."],["admonish","ad-MON-ish","verb","To warn or reprimand someone gently but firmly.","The teacher admonished him for talking during the test."],["sagacious","suh-GAY-shus","adjective","Wise and showing good judgment.","Our sagacious mentor saw the problem coming."],["repercussion","ree-per-KUSH-un","noun","An unintended consequence, usually bad.","Think about the repercussions before you quit."],["unequivocal","un-ih-KWIV-uh-kul","adjective","Completely clear, leaving no doubt.","Her answer was an unequivocal no."],["amalgamate","uh-MAL-guh-mayt","verb","To combine or unite into one.","The two departments will amalgamate next year."],["unprecedented","un-PRES-ih-den-tid","adjective","Never done or known before.","The heat wave was unprecedented for October."],["sanguine","SANG-gwin","adjective","Optimistic, especially in a tough situation.","Despite the slow start, the coach was sanguine about the season."],["conducive","kun-DOO-siv","adjective","Helping to make something possible.","A quiet room is conducive to studying."],["circumspect","SUR-kum-spekt","adjective","Cautious and careful to consider risks.","Be circumspect about what you post online."],["judicious","joo-DISH-us","adjective","Showing good judgment.","A judicious use of humor makes a speech memorable."],["precedent","PRES-ih-dent","noun","An earlier event used as an example for later ones.","Letting one person leave early sets a precedent."],["hubris","HYOO-bris","noun","Excessive pride or self-confidence.","It was pure hubris to skip practice the week before the final."],["stoic","STOH-ik","adjective","Enduring hardship without complaint.","He remained stoic through the long recovery."],["vigilant","VIJ-uh-lent","adjective","Watchful for danger or problems.","Stay vigilant about phishing emails."],["feasible","FEE-zuh-bul","adjective","Possible and practical.","Is it feasible to finish by Friday?"],["recalcitrant","rih-KAL-sih-trent","adjective","Stubbornly uncooperative.","Getting a recalcitrant toddler into a car seat is an art."],["ubiquitous","yoo-BIK-wih-tus","adjective","Present or found everywhere.","Smartphones are so ubiquitous that it’s strange to see someone without one."],["vindicate","VIN-dih-kayt","verb","To show that someone was right or not to blame.","The test results vindicated her decision to delay the launch."],["garrulous","GAIR-uh-lus","adjective","Excessively talkative.","The garrulous taxi driver told us his whole life story."],["ostensibly","oh-STEN-sih-blee","adverb","Apparently or supposedly, but perhaps not actually.","He came over, ostensibly to return my book, but really to see the new puppy."],["relegate","REL-ih-gayt","verb","To move to a lower position.","My old phone has been relegated to an alarm clock."],["censure","SEN-sher","noun","Strong formal disapproval.","The senator faced censure from his own party."],["compelling","kum-PEL-ing","adjective","Convincing or attention-grabbing.","She made a compelling argument for a four-day week."],["scrupulous","SKROO-pyuh-lus","adjective","Very careful to be honest and do things correctly.","He’s scrupulous about reporting every expense."],["ephemeral","ih-FEM-er-ul","adjective","Lasting a very short time.","Online trends are ephemeral; by next week nobody will remember this one."],["incentivize","in-SEN-tih-vyze","verb","To motivate with a reward.","Discounts incentivize people to sign up early."],["dissent","dih-SENT","noun","Disagreement with an official or majority view.","There was dissent among the board members."],["oblivious","uh-BLIV-ee-us","adjective","Unaware of what’s happening around you.","He was oblivious to the fact that everyone was waiting."],["renounce","rih-NOWNS","verb","To formally give up a claim, belief, or habit.","She renounced her old habits and started fresh."],["stymie","STY-mee","verb","To block or hinder progress.","Red tape stymied the project for months."],["opulent","OP-yuh-lent","adjective","Lavish and luxurious.","The hotel lobby was opulent, with gold and marble everywhere."],["duplicity","doo-PLIS-ih-tee","noun","Deceitfulness; being two-faced.","Her duplicity came out when both friends compared notes."],["premise","PREM-is","noun","The basic idea an argument or story is based on.","The movie’s premise is clever, but the ending falls flat."]];
const PHRASES=[["Run of the mill","From fabric fresh off the mill, not yet inspected","Ordinary; nothing special.","It’s a run-of-the-mill hotel, but the location is great.","run-of-the-mill"],["Nom de plume","French-styled phrase, “pen name”","A pseudonym used by a writer.","Mark Twain was the nom de plume of Samuel Clemens."],["Light at the end of the tunnel","English idiom","Signs that a difficult period is ending.","After months of renovation, we finally see light at the end of the tunnel."],["Not my cup of tea","British idiom","Not something I enjoy.","Horror movies aren’t my cup of tea.","my cup of tea"],["A perfect storm","From meteorology, popularized by a 1997 book","A rare combination of factors that makes a situation much worse.","Rising rents and low wages created a perfect storm."],["Post mortem","Latin, “after death”","An analysis of what went wrong after an event.","Let’s do a post mortem on the failed launch."],["A flash in the pan","From old flintlock guns that sometimes flashed without firing","A sudden success that doesn’t last.","Critics thought the band was a flash in the pan, but they’re still touring.","flash in the pan"],["Ipso facto","Latin, “by that very fact”","As a direct result of the fact mentioned.","He had the only key, so he was ipso facto responsible for locking up."],["A rule of thumb","English idiom","A practical, rough guideline based on experience.","As a rule of thumb, save 20% of your income.","rule of thumb"],["The whole nine yards","American idiom of disputed origin","Everything; all the way.","They went the whole nine yards: catering, band, and fireworks."],["A priori","Latin, “from what comes before”","Based on reasoning rather than experience.","You can’t assume a priori that the plan will fail."],["Pro bono","Latin, “for the good”","Done for free, especially professional work.","The lawyer took the case pro bono."],["Dead in the water","From sailing, a ship that can’t move","Failed and unable to make progress.","Without
