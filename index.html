","If you think it’ll work, put your money where your mouth is."],["Caught red-handed","Old Scottish legal expression, as if with blood on the hands","Caught in the act of doing something wrong.","The kid was caught red-handed with the cookie jar."],["Sine qua non","Latin, “without which not”","An absolutely essential ingredient.","Trust is the sine qua non of any partnership."],["Non sequitur","Latin, “it does not follow”","A statement that doesn’t logically follow from what came before.","His reply about the weather was a complete non sequitur."],["Your guess is as good as mine","English expression","I don’t know either.","When will the train come? Your guess is as good as mine."],["Quid pro quo","Latin, “something for something”","A favor given in exchange for another.","There was a clear quid pro quo: they’d promote our event if we promoted theirs."],["A drop in the bucket","English idiom","A tiny amount compared to what’s needed.","Our donation is a drop in the bucket, but it helps."],["In the driver’s seat","English idiom","In control.","With two offers, you’re in the driver’s seat."],["Bite off more than you can chew","English idiom","To take on more than you can handle.","I bit off more than I could chew by volunteering for three committees.","bit off more than I could chew"],["Doesn’t hold water","English idiom","Doesn’t stand up to scrutiny.","His excuse doesn’t hold water."],["The jury is still out","From courtroom language","A decision or opinion hasn’t been reached yet.","The jury is still out on whether the new policy works."],["It’s not rocket science","Modern English expression","It’s not complicated.","Just plug it in and press start; it’s not rocket science."],["Lingua franca","Italian, “Frankish language”","A common language between speakers of different native languages.","English is the lingua franca of international aviation."],["Let off the hook","From fishing","To free from blame or obligation.","I’ll let you off the hook this time.","let you off the hook"],["Call a spade a spade","English expression with ancient Greek roots","To speak plainly and honestly.","Let’s call a spade a spade: the project is over budget."],["Cause célèbre","French, “famous case”","An issue that attracts great public attention.","The case became a cause célèbre."],["Don’t count your chickens before they hatch","From Aesop’s fables","Don’t rely on something good until it actually happens.","You haven’t signed the contract yet; don’t count your chickens before they hatch."],["Vice versa","Latin, “the position turned”","The other way around.","I help her with math, and vice versa."],["The writing on the wall","From the Bible’s book of Daniel","Clear signs that something bad is coming.","When the budget was cut twice, the writing was on the wall.","writing was on the wall"],["Low-hanging fruit","Business idiom","The easiest tasks or opportunities to tackle first.","Let’s start with the low-hanging fruit and fix the typos."],["Kitsch","German, “trashy”","Art or objects considered tacky, often enjoyed ironically.","Her apartment is full of kitsch, like flamingo lamps."],["Second-guess","English expression","To doubt a decision after it’s made.","Stop second-guessing yourself; you chose well.","second-guessing"],["Wild card","From card games","An unpredictable person or factor.","The new candidate is a wild card."],["Discretion is the better part of valor","From Shakespeare’s Henry IV, Part 1","Caution is often wiser than bravery.","I didn’t argue with the angry driver; discretion is the better part of valor."],["A sight for sore eyes","English idiom","Someone or something you’re very glad to see.","After that long drive, the hotel was a sight for sore eyes."],["Carpe diem","Latin, “seize the day,” from the poet Horace","Make the most of the present moment.","Tickets were still available, so carpe diem, we booked the trip that night."],["Mea culpa","Latin, “my fault”","An admission that you made a mistake.","Mea culpa; I forgot to send the invite."],["Coup de grâce","French, “stroke of mercy”","A final blow that ends something.","The rain was the coup de grâce for our picnic."],["A skeleton in the closet","English idiom","A hidden, embarrassing secret from the past.","Every politician seems to have a skeleton in the closet.","skeleton in the closet"],["Set in stone","English idiom","Fixed and impossible to change.","The schedule isn’t set in stone."],["Few and far between","English idiom","Rare; not often found.","Good plumbers are few and far between."],["Cul-de-sac","French, “bottom of the bag”","A dead-end street; also, a situation with no way forward.","The negotiations hit a cul-de-sac."],["Alter ego","Latin, “other self”","A second self or alternative personality.","On weekends, his alter ego is a punk drummer."],["In medias res","Latin, “into the middle of things”","Starting a story in the middle of the action.","The movie starts in medias res, with a car chase."],["A dime a dozen","American idiom","Very common and of little value.","Coffee shops are a dime a dozen in this city."],["Turn a blind eye","Linked to Admiral Nelson, who supposedly held a telescope to his blind eye","To deliberately ignore something wrong.","The manager turned a blind eye to the long lunches.","turned a blind eye"],["Enfant terrible","French, “terrible child”","A person whose unconventional behavior shocks others.","He’s the enfant terrible of the fashion world."],["Do your due diligence","From legal and business language","Do the careful research a responsible person should do before deciding.","Before we sign with this contractor, let’s do our due diligence and call a few past clients.","do our due diligence"],["Jump through hoops","From circus animals","To go through a lot of difficult steps.","We had to jump through hoops to get the permit."],["On the back burner","From cooking","Set aside for later.","The redesign is on the back burner until spring."],["Veni, vidi, vici","Latin, “I came, I saw, I conquered,” attributed to Julius Caesar","A quick, decisive victory.","She walked in, gave the pitch, and closed the deal: veni, vidi, vici."],["A necessary evil","English expression","Something unpleasant but needed.","Meetings are a necessary evil."],["Under the weather","From sailing, seasick passengers went below deck","Feeling ill.","I’m a bit under the weather today."],["Lose the plot","British idiom","To become confused or irrational.","He’s completely lost the plot over this parking spot.","lost the plot"],["Keep it under wraps","English idiom","To keep something secret.","Keep the surprise party under wraps.","under wraps"],["Pandora’s box","From the Greek myth of Pandora, who released the world’s troubles","Something that, once started, causes many unforeseen problems.","Asking about his ex opened a Pandora’s box."],["Sour grapes","From Aesop’s fable of the fox who couldn’t reach the grapes","Pretending not to want something you couldn’t get.","He says he never wanted the promotion, but that’s sour grapes."],["Every cloud has a silver lining","English proverb, inspired by a line from Milton","Something good can come from a bad situation.","I lost my job, but every cloud has a silver lining; I started my own business."],["Put a pin in it","Modern business idiom","To pause a topic and return to it later.","Let’s put a pin in that and come back after lunch.","put a pin in that"],["Get the ball rolling","English idiom","To start something.","Let’s get the ball rolling with a quick intro round."],["In good faith","English legal expression","With honest intentions.","We negotiated in good faith, so the sudden price change was a shock."],["Wanderlust","German, “desire to wander”","A strong desire to travel.","Her wanderlust took her to forty countries."],["Behind the eight ball","From billiards","In a difficult, disadvantaged position.","Missing the first week put me behind the eight ball."],["In a nutshell","English idiom","In very few words.","In a nutshell, we need more money."],["The path of least resistance","English expression, from physics","The easiest option, often chosen out of laziness.","Saying yes was the path of least resistance."],["Two wrongs don’t make a right","English proverb","Responding to a wrong with another wrong isn’t justified.","He insulted you, but two wrongs don’t make a right."],["The tip of the iceberg","English idiom; most of an iceberg is hidden underwater","A small, visible part of a much bigger problem.","The late invoices were just the tip of the iceberg."],["Dot the i’s and cross the t’s","English idiom","To pay attention to every small detail.","Before you submit the application, dot the i’s and cross the t’s."],["Hit the ground running","English idiom","To start something with energy and immediate effect.","The new hire hit the ground running."],["Status quo","Latin, “the state in which”","The existing state of affairs.","The new manager isn’t interested in keeping the status quo."],["The proof is in the pudding","Short for “the proof of the pudding is in the eating”","Something’s quality is judged by results.","The diet sounds weird, but the proof is in the pudding."],["Joie de vivre","French, “joy of living”","A cheerful enjoyment of life.","My grandmother’s joie de vivre is contagious."],["Prima facie","Latin, “at first face”","Based on first impression; on the surface.","There’s prima facie evidence of fraud."],["In hot water","English idiom","In trouble.","He’s in hot water for missing the meeting."],["See eye to eye","English idiom","To fully agree.","We don’t always see eye to eye, but we respect each other."],["Raise the bar","From high jump and pole vault","To set a higher standard.","Her presentation raised the bar for everyone.","raised the bar"],["Blow off steam","From steam engines releasing pressure","To release built-up energy or frustration.","I go for a run to blow off steam after work."],["Second nature","English expression","Something you do so often it feels automatic.","After a few weeks, typing without looking becomes second nature."],["Ring a bell","English idiom","To sound familiar.","His name rings a bell.","rings a bell"],["The emperor’s new clothes","From Hans Christian Andersen’s fairy tale","Something everyone pretends to admire, though it’s obviously empty.","That overpriced art installation is the emperor’s new clothes."],["Rest on your laurels","From ancient Greece, where winners got laurel wreaths","To rely on past success instead of working harder.","We won last year, but we can’t rest on our laurels.","rest on our laurels"],["To err is human","From Alexander Pope’s 1711 poem, “to err is human, to forgive divine”","Everyone makes mistakes.","Don’t be too hard on yourself; to err is human."],["Stick to your guns","From soldiers holding their positions","To refuse to change your mind under pressure.","Everyone disagreed, but she stuck to her guns.","stuck to her guns"],["A foregone conclusion","From Shakespeare’s Othello","A result that’s certain before it happens.","With their best player injured, the loss was a foregone conclusion."],["Take a back seat","English idiom","To take a less important role.","My hobbies have taken a back seat to work.","taken a back seat"],["Ahead of the curve","English idiom","Ahead of others in adopting new ideas.","The company was ahead of the curve on remote work."],["Put all your eggs in one basket","English proverb","To risk everything on one thing.","Don’t put all your eggs in one basket; apply to several schools."],["Bona fide","Latin, “in good faith”","Genuine; real.","He’s a bona fide expert, not just someone with a blog."],["Kill two birds with one stone","English idiom","To accomplish two things with one action.","I’ll pick up groceries on the way back and kill two birds with one stone."],["Schadenfreude","German, “harm-joy”","Pleasure at someone else’s misfortune.","I felt a little schadenfreude when the rude driver got a ticket."],["Keep someone at arm’s length","English idiom","To avoid getting too close to someone.","She keeps new coworkers at arm’s length at first.","at arm’s length"],["Et tu, Brute?","Latin, from Shakespeare’s Julius Caesar","An expression of betrayal by a friend.","You voted against me too? Et tu, Brute?"],["Burn the midnight oil","English idiom, from working by oil lamp","To work late into the night.","We burned the midnight oil to finish the proposal.","burned the midnight oil"],["To the effect of","English expression","Something with roughly this meaning; used when paraphrasing.","She said something to the effect of “we’ll revisit this next quarter.”"],["A tall order","English idiom","A difficult request.","Finishing the whole report by noon is a tall order."],["The big picture","English idiom","The overall view of a situation.","Don’t get lost in details; look at the big picture."],["Jump the gun","From races, starting before the starting pistol","To act too soon.","Don’t jump the gun; wait for official confirmation."],["Esprit de l’escalier","French, “staircase wit”","Thinking of the perfect reply too late.","I thought of a great comeback on the drive home: esprit de l’escalier."],["Salt of the earth","From the Bible’s Gospel of Matthew","A good, honest, dependable person.","My grandparents were salt of the earth."],["Double entendre","From French, “double meaning”","A phrase with two meanings, one often risqué.","The comedian’s act was full of double entendres.","double entendre"],["A blessing in disguise","English idiom","Something that seems bad at first but turns out well.","Missing that flight was a blessing in disguise; I met my wife at the airport."],["Take the bull by the horns","English idiom","To deal with a problem directly and boldly.","I took the bull by the horns and asked for a raise.","took the bull by the horns"],["Call it a day","English idiom","To stop working for now.","We’ve done enough; let’s call it a day."],["Fall on deaf ears","English idiom","To be ignored.","My warnings fell on deaf ears.","fell on deaf ears"],["Alma mater","Latin, “nourishing mother”","The school or university someone attended.","She gives back to her alma mater every year."],["Modus operandi","Latin, “mode of operating”","A person’s usual way of doing things.","Showing up late with coffee is his modus operandi."],["Ad nauseam","Latin, “to sickness”","Repeated to a tiresome degree.","He talked about his new car ad nauseam."],["Put your foot down","English idiom","To firmly refuse or insist.","I put my foot down about phones at dinner.","put my foot down"],["Miss the boat","English idiom","To miss an opportunity.","I missed the boat on buying a house before prices rose.","missed the boat"],["A Pyrrhic victory","From King Pyrrhus, whose wins against Rome cost him much of his army","A win that costs so much it’s barely worth having.","Winning the argument was a Pyrrhic victory; we didn’t speak for a week.","Pyrrhic victory"],["Keep your eye on the ball","From sports","To stay focused on the goal.","Don’t get distracted; keep your eye on the ball."],["Toe the line","English idiom","To follow rules or conform to expectations.","Employees are expected to toe the line on dress code."],["Avant-garde","French, “advance guard”","New and experimental, especially in the arts.","The gallery shows avant-garde work."],["Devil’s advocate","From a Catholic Church official who argued against proposed saints","Someone who argues the other side on purpose to test an idea.","Let me play devil’s advocate: what if customers don’t want this?"],["The bottom line","From accounting, the final line of a financial statement","The most important point.","The bottom line is we can’t afford it."],["Add insult to injury","From an ancient Roman fable","To make a bad situation even worse.","My flight was cancelled, and to add insult to injury, they lost my bag."],["Gestalt","German, “shape” or “form”","A whole that’s more than the sum of its parts.","The album’s gestalt is more powerful than any single song."],["Get a second wind","From running, a burst of energy after exhaustion","Renewed energy to keep going.","I got a second wind after lunch and finished the report.","got a second wind"],["Take it with a grain of salt","From a Latin phrase in Pliny the Elder","To be skeptical about something.","Take online reviews with a grain of salt.","with a grain of salt"],["By the book","English idiom","Strictly following the rules.","Our accountant does everything by the book."],["Up the ante","From poker","To raise the stakes or demands.","The rival company upped the ante with free shipping.","upped the ante"],["Shoot the messenger","English expression with roots in ancient history","To blame the person who delivers bad news.","Don’t shoot the messenger; I’m just telling you what the client said."],["Carte blanche","French, “blank card”","Complete freedom to act.","The new chef was given carte blanche with the menu."],["Hit below the belt","From boxing, where hitting below the belt is illegal","An unfair attack.","Bringing up his divorce was a hit below the belt."],["Bend over backwards","English idiom","To try very hard to help.","The staff bent over backwards to fix our reservation.","bent over backwards"],["Spill the beans","English idiom","To reveal a secret.","Who spilled the beans about the surprise?","spilled the beans"],["Cold turkey","American idiom","Quitting something suddenly and completely.","He quit smoking cold turkey."],["Bury the hatchet","English idiom","To make peace and end a conflict.","After years of not speaking, the brothers finally buried the hatchet.","buried the hatchet"],["Achilles’ heel","From the Greek hero Achilles, invulnerable except for his heel","A single weak spot in something otherwise strong.","Public speaking is my Achilles’ heel."],["Hit the books","American idiom","To study hard.","I need to hit the books before the exam."],["Out of the loop","English idiom","Not informed.","I’ve been out of the loop since my vacation."],["Damned if you do, damned if you don’t","English expression","Criticized no matter which choice you make.","If I speak up, I’m pushy; if I don’t, I’m weak. Damned if you do, damned if you don’t."],["Big fish in a small pond","English idiom","Important only in a small group.","At the small firm he was a big fish in a small pond."],["Come full circle","English expression","To return to where you started, often with new understanding.","I started my career here, and now I’ve come full circle."],["To make a long story short","English expression","To summarize.","To make a long story short, we missed the train."],["Throw someone under the bus","Modern American idiom","To sacrifice someone else to protect yourself.","When the project failed, he threw his assistant under the bus.","threw his assistant under the bus"],["Cost an arm and a leg","English idiom","To be very expensive.","That car repair cost an arm and a leg."],["Ad hoc","Latin, “for this”","Created for one particular purpose, often improvised.","We formed an ad hoc group to plan the holiday party."],["Go down the rabbit hole","From Alice’s Adventures in Wonderland","To get absorbed in a strange or endless topic.","I went down a rabbit hole researching medieval cheese.","down a rabbit hole"],["A wild goose chase","English idiom, used by Shakespeare","A pointless search for something you won’t find.","The directions sent us on a wild goose chase around town."],["In lieu of","From French, “in place of”","Instead of.","In lieu of flowers, the family asked for donations."],["A level playing field","English idiom","A situation where everyone has an equal chance.","New rules should create a level playing field for small businesses.","level playing field"],["A moving target","English idiom","Something that keeps changing, making it hard to achieve.","The deadline has become a moving target.","moving target"],["Pull out all the stops","From pipe organs, where pulling stops makes them louder","To make every possible effort.","They pulled out all the stops for the anniversary party.","pulled out all the stops"],["Beat around the bush","English idiom, from hunters beating bushes to flush out birds","To avoid getting to the point.","Stop beating around the bush and tell me what happened.","beating around the bush"],["Cut to the chase","From early films, skipping to the chase scene","To get to the point.","Let’s cut to the chase: how much will it cost?"],["In the loop","English idiom","Informed and included.","Keep me in the loop on the project."],["Through thick and thin","From an old hunting phrase about thickets and thin woods","Through good times and bad.","They’ve been friends through thick and thin."],["Sit tight","English idiom","To wait patiently without acting.","Sit tight; the doctor will be with you soon."],["Per capita","Latin, “by heads”","For each person.","The country has the highest coffee consumption per capita."],["You can’t have your cake and eat it too","English proverb","You can’t have two incompatible things.","You want a big house and no mortgage? You can’t have your cake and eat it too."],["A moot point","English idiom","A matter that no longer matters or can’t be settled.","Whether we’d have won is a moot point now that the game’s cancelled.","moot point"],["A canary in a coal mine","From miners who used canaries to detect toxic gas","An early warning sign of danger.","Falling sales at small shops are a canary in a coal mine for the economy."],["The ball is in your court","From tennis","It’s your turn to act or decide.","I’ve made my offer; the ball is in your court."],["Splitting hairs","English idiom","Arguing over tiny, unimportant differences.","Whether it was 9:58 or 10:02 is splitting hairs; we were on time."],["Bon appétit","French, “good appetite”","Enjoy your meal.","Dinner is served; bon appétit!"],["Get cold feet","English idiom","To become nervous and back out.","He got cold feet the night before the wedding.","got cold feet"],["Ruffle feathers","English idiom, from an annoyed bird","To upset or annoy people.","Her blunt feedback ruffled a few feathers.","ruffled a few feathers"],["All that glitters is not gold","From Shakespeare’s The Merchant of Venice","Not everything attractive is valuable.","The job looks glamorous, but all that glitters is not gold."],["Wrap your head around","Modern English idiom","To understand something difficult.","I can’t wrap my head around these tax rules.","wrap my head around"],["Meet your Waterloo","From Napoleon’s final defeat at Waterloo in 1815","To face a final, decisive defeat.","The champion finally met his Waterloo in the semifinal.","met his Waterloo"],["The exception that proves the rule","English proverb, from a Latin legal principle","A rare exception that highlights how strong the general rule is.","He’s the exception that proves the rule; most people hate early mornings."],["When pigs fly","English idiom","Never; something that will never happen.","He’ll clean his room when pigs fly."],["Not playing with a full deck","English idiom","Not thinking clearly.","Anyone who turned down that offer isn’t playing with a full deck.","playing with a full deck"],["Nip it in the bud","From gardening, removing a bud before it blooms","To stop a problem early.","If the team starts gossiping, nip it in the bud."],["A case in point","English expression","A clear example of what was just said.","Prices keep rising; my grocery bill is a case in point."],["Murphy’s law","20th-century American saying","Anything that can go wrong will go wrong.","Murphy’s law: the printer jammed five minutes before the meeting."],["Throw caution to the wind","English idiom","To act without worrying about risks.","We threw caution to the wind and booked a last-minute trip.","threw caution to the wind"],["Off the cuff","From speakers who wrote notes on their shirt cuffs","Spoken without preparation.","Her best speeches are off the cuff."],["A vicious circle","English expression","A cycle where one problem causes another that makes the first worse.","Stress keeps me from sleeping, and lack of sleep makes me stressed; it’s a vicious circle."],["A needle in a haystack","English idiom","Something nearly impossible to find.","Finding my car in that parking lot was like finding a needle in a haystack.","needle in a haystack"],["Go against the grain","From woodworking","To do something contrary to what’s normal or expected.","Opening a bookstore in the age of e-books goes against the grain.","goes against the grain"],["Hoist with one’s own petard","From Shakespeare’s Hamlet; a petard was a small bomb","Harmed by your own plan meant to hurt others.","He set the strict deadline and then missed it; hoist with his own petard.","hoist with his own petard"],["Beyond the pale","From the historical “Pale” boundary around English-controlled Dublin","Outside the bounds of acceptable behavior.","His comments about her family were beyond the pale."],["Cherry-pick","English idiom","To select only the best or most convenient options.","He cherry-picked statistics that supported his argument.","cherry-picked"],["Actions speak louder than words","English proverb","What you do matters more than what you say.","He says he’s sorry, but actions speak louder than words."],["Between Scylla and Charybdis","From two sea monsters in Homer’s Odyssey","Stuck between two equally dangerous choices.","Raise prices or cut staff? We’re between Scylla and Charybdis."],["Catch-22","From Joseph Heller’s 1961 novel","A no-win situation caused by contradictory rules.","You need experience to get a job, and a job to get experience; a classic Catch-22."],["Under the radar","From aircraft flying low to avoid radar","Without attracting attention.","The startup flew under the radar for years."],["Leave no stone unturned","Proverb with ancient Greek roots","To search thoroughly or try every possibility.","The detective left no stone unturned.","left no stone unturned"],["Caveat emptor","Latin, “let the buyer beware”","The buyer is responsible for checking quality.","Caveat emptor: check the reviews before buying from that site."],["The last straw","From the proverb about a straw breaking a camel’s back","The final problem that makes a situation unbearable.","When he forgot my birthday again, that was the last straw."],["Play hardball","From baseball","To be tough and uncompromising.","The landlord is playing hardball over the deposit.","playing hardball"],["Bon vivant","French, “good liver”","Someone who enjoys good food and drink.","My uncle is a bon vivant who knows every wine bar in Paris."],["Out of left field","From baseball","Unexpected or strange.","His question came out of left field."],["Cut your losses","From gambling and trading","To stop an effort that’s failing before losing more.","The project wasn’t working, so we cut our losses.","cut our losses"],["Jump on the bandwagon","From 19th-century American political parades","To join something because it’s popular.","Everyone jumped on the bandwagon when the team started winning.","jumped on the bandwagon"],["Smoke and mirrors","From stage magic tricks","Deception designed to distract from reality.","The financial report was all smoke and mirrors."],["Necessity is the mother of invention","English proverb","Need drives creativity.","We used a book as a laptop stand; necessity is the mother of invention."],["In the same boat","English idiom","In the same difficult situation as others.","Don’t worry, we’re all in the same boat."],["Read the room","English expression","To sense the mood of a group and act accordingly.","He didn’t read the room and told a joke at the funeral."],["A wolf in sheep’s clothing","From a fable and a line in the Bible","Someone dangerous who appears harmless.","The friendly “advisor” turned out to be a wolf in sheep’s clothing."],["Jack of all trades, master of none","English proverb","Someone with many skills but no expertise.","I’m a jack of all trades, master of none.","jack of all trades"],["Laissez-faire","French, “let do”","A hands-off approach.","Our manager has a laissez-faire style."],["A fly in the ointment","English idiom, traced to the Bible’s book of Ecclesiastes","A small flaw that spoils something otherwise good.","The trip was perfect; the only fly in the ointment was the lost luggage.","fly in the ointment"],["Out of sight, out of mind","English proverb","People forget things they don’t see.","I hide the snacks; out of sight, out of mind."],["Cut the mustard","American idiom","To meet expectations.","His first draft didn’t cut the mustard."],["Throw down the gauntlet","From knights throwing down a glove as a challenge","To issue a challenge.","The rival company threw down the gauntlet with half-price deals.","threw down the gauntlet"],["Brevity is the soul of wit","From Shakespeare’s Hamlet","Clever speech is short.","Keep the toast short; brevity is the soul of wit."],["Esprit de corps","French, “spirit of the body”","Team spirit and loyalty.","The team’s esprit de corps carried them through the season."],["A stone’s throw","English idiom","A very short distance.","The apartment is a stone’s throw from the beach."],["A hot potato","English idiom","A controversial issue no one wants to handle.","Healthcare costs are a political hot potato.","hot potato"],["Per se","Latin, “by itself”","In itself; intrinsically.","The idea isn’t bad per se, it’s just badly timed."],["To that end","English expression","In order to achieve that goal.","We want to grow sales. To that end, we’re hiring two more reps."],["Go back to the well","English idiom","To return to a source that worked before.","They keep going back to the well with sequels.","going back to the well"],["The tail wagging the dog","English idiom","A minor part controlling the whole.","Letting one customer dictate our product is the tail wagging the dog."],["A Trojan horse","From the Greek story of soldiers hidden inside a wooden horse at Troy","Something that looks harmless but hides a threat.","The free app was a Trojan horse for collecting your data.","Trojan horse"],["Ad lib","Short for Latin ad libitum, “at pleasure”","To improvise.","She forgot her notes and had to ad lib."],["At the drop of a hat","English idiom","Immediately, without hesitation.","She’ll travel anywhere at the drop of a hat."],["Give someone the benefit of the doubt","English idiom","To believe someone’s claim without proof.","I’ll give him the benefit of the doubt; maybe the email really did bounce.","give him the benefit of the doubt"],["Paint with a broad brush","English idiom","To generalize without considering details.","Don’t paint all critics with a broad brush.","with a broad brush"],["A fair-weather friend","English idiom","Someone who’s only around when things are going well.","When I got sick, I found out who my fair-weather friends were.","fair-weather friends"],["Throw in the towel","From boxing, where a towel is thrown to concede","To give up.","After three failed attempts, he threw in the towel.","threw in the towel"],["Can’t see the forest for the trees","English idiom","So focused on details that you miss the big picture.","He’s so obsessed with fonts that he can’t see the forest for the trees."],["A slippery slope","English expression","A small step that leads to a chain of worse ones.","Skipping one workout is a slippery slope."],["By and large","From sailing terminology","Generally; on the whole.","By and large, the event was a success."],["Je ne sais quoi","French, “I don’t know what”","An attractive quality that’s hard to describe.","The little café has a certain je ne sais quoi."],["De rigueur","French, “of strictness”","Required by fashion or custom.","Black tie is de rigueur at the gala."],["Tour de force","French, “feat of strength”","An impressive achievement.","Her performance was a tour de force."],["Hoi polloi","Greek, “the many”","The masses; ordinary people (often used snobbishly).","The VIP lounge keeps celebrities away from the hoi polloi."],["Pièce de résistance","French, “piece of resistance”","The best or most impressive part.","The chocolate cake was the pièce de résistance."],["Bite the bullet","English idiom","To do something unpleasant that you’ve been avoiding.","I finally bit the bullet and booked the dentist appointment.","bit the bullet"],["Over the moon","English idiom","Extremely happy.","She was over the moon about the news."],["Hit the nail on the head","English idiom","To describe something exactly right.","You hit the nail on the head; the problem is communication."],["A fish out of water","English idiom","Someone uncomfortable in an unfamiliar situation.","At the fancy gala, I felt like a fish out of water.","fish out of water"],["On the same page","English idiom","In agreement or with the same understanding.","Let’s meet briefly so we’re all on the same page."],["De facto","Latin, “in fact”","Existing in practice, even if not official.","She’s the de facto team leader, even without the title."],["Be that as it may","English expression","Even if that is true.","You were tired; be that as it may, you still owe her an apology."],["A house of cards","English idiom","A plan or system so weak it could easily collapse.","Their business model is a house of cards built on debt."],["Cross the Rubicon","From Julius Caesar crossing the Rubicon river in 49 BC","To pass a point of no return.","Once we signed the lease, we’d crossed the Rubicon.","crossed the Rubicon"],["Déjà vu","French, “already seen”","The feeling you’ve experienced something before.","Walking into that café gave me déjà vu."],["Realpolitik","German, “politics of reality”","Politics based on practical goals rather than ideals.","The alliance was pure realpolitik."],["Tabula rasa","Latin, “scraped tablet”","A clean slate.","Moving to a new city felt like a tabula rasa."],["Think outside the box","Business expression, linked to the nine-dot puzzle","To think creatively and unconventionally.","We need to think outside the box to cut costs."],["Let sleeping dogs lie","English proverb, recorded since the 1300s","Don’t stir up an old problem.","I thought about bringing up the argument, but decided to let sleeping dogs lie."],["A chip on your shoulder","American idiom","A long-held grudge or sense of grievance.","He’s had a chip on his shoulder since he didn’t get the promotion.","chip on his shoulder"],["On the ball","From sports","Alert and quick to respond.","The new assistant is really on the ball."],["Ahead of its time","English expression","Too advanced to be appreciated when it appeared.","The design was ahead of its time."],["Vox populi","Latin, “voice of the people”","Public opinion.","The vox populi is clear: people want more parks."],["A zero-sum game","From game theory","A situation where one person’s gain is another’s loss.","Friendship isn’t a zero-sum game.","zero-sum game"],["In absentia","Latin, “in absence”","While not present.","He received the award in absentia."],["A litmus test","From chemistry, litmus paper shows acid or base","A single test that reveals someone’s true position or quality.","How someone treats waiters is a litmus test of their character."],["Across the board","From horse-race betting","Applying to everyone or everything equally.","The company gave raises across the board."],["Terra incognita","Latin, “unknown land”","An unfamiliar area or subject.","Tax law is terra incognita to me."],["Above board","From card games, where cheaters hid hands under the table","Honest and open.","Don’t worry, the deal is completely above board."],["All things considered","English expression","Taking everything into account.","All things considered, the trip went well."],["A storm in a teacup","British idiom","A lot of fuss over something unimportant.","The argument over the office fridge was a storm in a teacup."],["Burn bridges","From armies burning bridges behind them","To destroy relationships in a way that can’t be undone.","Leave politely; don’t burn bridges."],["Hobson’s choice","Named after a 17th-century English stable owner who offered only one horse","A “choice” with only one real option.","Take the 6 a.m. flight or don’t go at all; that’s Hobson’s choice."],["Bite your tongue","English idiom","To stop yourself from saying something.","I had to bite my tongue when he took credit for my idea.","bite my tongue"],["Barking up the wrong tree","From hunting dogs barking at the wrong tree","Pursuing a mistaken idea or blaming the wrong person.","If you think I ate your lunch, you’re barking up the wrong tree."],["Deus ex machina","Latin, “god from the machine,” from Greek theater","A sudden, too-convenient solution to an impossible problem.","The surprise inheritance in the last chapter felt like a deus ex machina."],["Persona non grata","Latin, “an unwelcome person”","Someone no longer welcome somewhere.","After the argument, he was persona non grata at the book club."],["Cross that bridge when we come to it","English expression","Deal with a problem only if and when it happens.","What if it rains? We’ll cross that bridge when we come to it."],["Wear your heart on your sleeve","English idiom, used by Shakespeare in Othello","To openly show your emotions.","He wears his heart on his sleeve.","wears his heart on his sleeve"],["Fait accompli","French, “accomplished fact”","Something already done, leaving no option to object.","By the time we heard about the merger, it was a fait accompli."],["C’est la vie","French, “that’s life”","An expression of acceptance.","The concert was cancelled. C’est la vie."],["Make waves","English idiom","To cause trouble or disrupt the status quo.","He’s new, so he doesn’t want to make waves yet."],["Face the music","English idiom","To accept the unpleasant consequences of your actions.","He missed the deadline and had to face the music."],["Straight from the horse’s mouth","From checking a horse’s age by its teeth","Directly from the original source.","I heard it straight from the horse’s mouth: the boss is retiring."],["On thin ice","English idiom","In a risky or precarious situation.","After being late twice this week, he’s on thin ice."],["A Herculean task","From the twelve labors of the Greek hero Hercules","A job requiring enormous effort.","Cleaning out the garage was a Herculean task.","Herculean task"],["The Streisand effect","Named after a 2003 incident involving Barbra Streisand","Trying to hide something only draws more attention to it.","Suing over the bad review created a Streisand effect.","Streisand effect"],["Bête noire","French, “black beast”","Something someone especially dislikes.","Slow walkers are my bête noire."],["Penny-wise and pound-foolish","British proverb","Careful with small expenses but wasteful with big ones.","Skipping the inspection to save $300 is penny-wise and pound-foolish."],["A ballpark figure","From baseball","A rough estimate.","Can you give me a ballpark figure for the renovation?","ballpark figure"],["Grasp at straws","English idiom, from a drowning person grabbing at anything","To try anything, however unlikely, in desperation.","Blaming the weather is just grasping at straws.","grasping at straws"],["Have a change of heart","English idiom","To change your opinion or feelings.","She had a change of heart and decided to stay.","change of heart"],["Out of the woods","English idiom","Past the danger or difficulty.","Sales are up, but we’re not out of the woods yet."],["Keep a level head","English idiom","To stay calm and sensible.","Keep a level head during the negotiation."],["Touché","French, “touched,” from fencing","Acknowledging a clever point against you.","Touché; I did say that last week."],["Rendezvous","French, “present yourselves”","An arranged meeting.","Let’s rendezvous at the café at noon."],["The devil is in the details","English proverb","Small details are where problems tend to hide.","The plan sounds great, but the devil is in the details."],["A quantum leap","Borrowed from physics","A sudden, large advance.","The new software is a ’s play it by ear."],["Noblesse oblige","French, “nobility obliges”","Privilege comes with responsibility to others.","The billionaire funded the library out of noblesse oblige."],["A baptism of fire","English idiom","A difficult first experience of something.","My first week as a teacher was a baptism of fire."],["Go the extra mile","English idiom, traced to the Bible","To make more effort than expected.","She always goes the extra mile for her customers.","goes the extra mile"],["A red herring","English idiom","Something that distracts from the real issue.","The argument about fonts was a red herring; the real problem was the budget."],["Pull the wool over someone’s eyes","English idiom","To trick or deceive someone.","Don’t let him pull the wool over your eyes; that “limited-time offer” runs every month.","pull the wool over your eyes"],["Tempus fugit","Latin, “time flies”","Time passes quickly.","My son starts college next week; tempus fugit."],["Put the cart before the horse","English idiom","To do things in the wrong order.","Buying furniture before finding an apartment is putting the cart before the horse.","putting the cart before the horse"],["Vis-à-vis","French, “face to face”","In relation to; regarding.","What’s our position vis-à-vis the new competitor?"],["Back to square one","English idiom","Back to the very beginning.","The client rejected the design, so we’re back to square one."],["Break a leg","Theater expression","Good luck.","Break a leg at your audition tonight!"],["Ad infinitum","Latin, “to infinity”","Endlessly; forever.","The list of complaints went on ad infinitum."],["Back to the drawing board","English idiom, from a 1941 cartoon","Time to start over with a new plan.","The prototype failed; back to the drawing board."],["The elephant in the room","English idiom","An obvious problem that no one wants to mention.","Can we talk about the elephant in the room? The budget is gone."],["Cry wolf","From Aesop’s fable of the boy who cried wolf","To raise false alarms so often that no one believes you.","He cries wolf about being sick so often that nobody believes him anymore.","cries wolf"],["A Sisyphean task","From Sisyphus, condemned to roll a boulder uphill forever","An endless, futile effort.","Keeping the kitchen clean with three kids is a Sisyphean task.","Sisyphean task"],["In the grand scheme of things","English expression","When you consider the bigger picture.","In the grand scheme of things, one bad review doesn’t matter."],["Par for the course","From golf, where par is the expected number of strokes","Normal or expected, usually for something unwelcome.","A two-hour delay is par for the course at that airport."],["Play your cards close to your chest","From card games","To keep your plans secret.","He’s playing his cards close to his chest about the new job.","playing his cards close to his chest"],["Bite the hand that feeds you","English idiom","To harm someone who helps you.","Criticizing your biggest client is biting the hand that feeds you.","biting the hand that feeds you"],["Crème de la crème","French, “cream of the cream”","The very best.","The conference attracts the crème de la crème of the industry."],["Water under the bridge","English idiom","Past events that no longer matter.","We argued last year, but that’s water under the bridge."],["Doppelgänger","German, “double-goer”","A person who looks exactly like someone else.","I saw your doppelgänger at the grocery store."],["Neither here nor there","English idiom","Irrelevant.","Whether he liked the color is neither here nor there; it’s already painted."],["Run the gauntlet","From a military punishment of running between two lines of attackers","To face a series of criticism or challenges.","The new mayor had to run the gauntlet of angry reporters."],["A sea change","From Shakespeare’s The Tempest","A dramatic, profound transformation.","There’s been a sea change in how people shop."],["The sword of Damocles","From a Greek tale of a courtier seated beneath a sword hung by a single hair","A constant, looming threat.","The rumored layoffs hung over the office like the sword of Damocles.","sword of Damocles"],["A far cry from","English idiom","Very different from.","This apartment is a far cry from my first studio."],["Draw a line in the sand","English idiom","To set a firm limit that can’t be crossed.","I drew a line in the sand: no work calls on weekends.","drew a line in the sand"],["Occam’s razor","Named after the medieval philosopher William of Ockham","The simplest explanation is usually the right one.","By Occam’s razor, the printer isn’t haunted; it’s just out of toner."],["In a manner of speaking","English expression","In a way; not literally.","In a manner of speaking, the dog runs this house."],["To a fault","English expression","To an excessive degree.","She’s generous to a fault."],["Let the cat out of the bag","English idiom","To accidentally reveal a secret.","My sister let the cat out of the bag about the surprise party."],["Bring to the table","English idiom","To offer something valuable.","What skills do you bring to the table?"],["Nouveau riche","French, “new rich”","People who recently became wealthy and show it off.","The mansion’s gold faucets screamed nouveau riche."],["Tilting at windmills","From Don Quixote, who attacked windmills thinking they were giants","Fighting imaginary enemies or pointless battles.","Complaining to the airline about legroom is tilting at windmills."],["By the same token","English expression","For the same reason; similarly.","He’s generous with praise, and by the same token, honest with criticism."],["Mum’s the word","English expression","Keep it secret.","About the surprise party: mum’s the word."],["Wunderkind","German, “wonder child”","A person who achieves great success young.","The 22-year-old CEO is a tech wunderkind."],["A watershed moment","From geography, a ridge dividing river systems","A turning point after which things are very different.","The first iPhone was a watershed moment for technology."],["A double-edged sword","English idiom","Something with both good and bad effects.","Working from home is a double-edged sword: no commute, but no boundaries."],["A bone of contention","English idiom, from dogs fighting over a bone","The subject of an ongoing disagreement.","The thermostat is a bone of contention in our office."],["Faux pas","French, “false step”","An embarrassing social mistake.","Wearing white to someone else’s wedding is a classic faux pas."],["Rock the boat","English idiom","To cause trouble or disturb a stable situation.","Don’t rock the boat right before the merger."],["Learn the ropes","From sailing, where new sailors learned the ship’s ropes","To learn the basics of a new job or activity.","It took me a month to learn the ropes at the new office."],["Point taken","English expression","I accept your argument.","Point taken; I’ll leave earlier next time."],["On the fence","English idiom","Undecided.","I’m still on the fence about the trip."],["Pay lip service","English idiom","To claim support without real action.","The company pays lip service to work-life balance.","pays lip service"],["Add fuel to the fire","English idiom","To make a bad situation worse.","Posting about it online will only add fuel to the fire."],["Steal someone’s thunder","From an 18th-century playwright whose stage thunder effect was copied","To take attention or credit from someone else.","She announced her engagement at my birthday and stole my thunder.","stole my thunder"],["On balance","English expression","After weighing everything.","On balance, I think the move was a good idea."],["Speak of the devil","English expression","Said when someone you’re talking about appears.","Speak of the devil; here comes Sam now."],["Familiarity breeds contempt","English proverb with roots in Aesop","Knowing someone too well can make you lose respect for them.","Roommates often learn that familiarity breeds contempt."],["Ergo","Latin, “therefore”","Therefore; consequently.","The store was closed; ergo, no milk."],["Hold your horses","American idiom","Wait; be patient.","Hold your horses, we haven’t even decided where to go."],["Savoir-faire","French, “knowing how to do”","The ability to act gracefully in social situations.","She handled the awkward guest with real savoir-faire."],["Read between the lines","English idiom","To understand a meaning that isn’t stated directly.","If you read between the lines, the email is really saying no."],["With flying colors","From ships returning victorious with flags flying","With great success.","She passed the exam with flying colors."],["The squeaky wheel gets the grease","American proverb","Those who complain loudest get attention.","I called the airline five times; the squeaky wheel gets the grease."],["A Faustian bargain","From the legend of Faust, who sold his soul to the devil","A deal where you trade something precious for short-term gain.","Taking the job for the money felt like a Faustian bargain.","Faustian bargain"],["Tongue in cheek","English idiom","Said ironically, not seriously.","His review was tongue in cheek."],["Between a rock and a hard place","American idiom","Facing two equally bad options.","I’m between a rock and a hard place: lose the deposit or move somewhere I hate."],["Swan song","From the legend that swans sing before they die","A final performance or effort.","The concert was the band’s swan song."],["Up in the air","English idiom","Uncertain or undecided.","Our travel plans are still up in the air."],["The Midas touch","From King Midas, who turned everything he touched to gold","The ability to make everything you do successful.","She has the Midas touch; every restaurant she opens is a hit.","Midas touch"],["Rain on someone’s parade","English idiom","To spoil someone’s happy moment.","I hate to rain on your parade, but the venue is booked.","rain on your parade"],["The calm before the storm","English idiom","A quiet period before trouble.","Monday morning is the calm before the storm."],["Make ends meet","English idiom","To have just enough money to live on.","They work two jobs to make ends meet."],["Easier said than done","English proverb","Simple to suggest but hard to do.","“Just relax” is easier said than done."],["All bark and no bite","English idiom","Threatening but not actually dangerous.","Don’t worry about the manager; he’s all bark and no bite."],["Magnum opus","Latin, “great work”","A person’s greatest work.","Many critics consider that novel her magnum opus."],["Down to the wire","From horse racing, where a wire marked the finish line","Until the last possible moment.","The election came down to the wire."],["Get to the bottom of","English idiom","To find the real cause.","We need to get to the bottom of these missing payments."]];
/* Day 0 is the first day you open the app; a new pair every day after that. */
const DAY = 86400000;
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
let start = store.get("lexicon:start");
if(!start){ start = midnight(new Date()).getTime(); store.set("lexicon:start", start); }
const dayIndex = d => Math.round((midnight(d) - start) / DAY);
const todayIdx = dayIndex(new Date());
let offset = 0;

const mod = (n,m) => ((n % m) + m) % m;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const $ = id => document.getElementById(id);
const POS = {adjective:"adjective",noun:"noun",verb:"verb",adverb:"adverb"};

function highlight(sentence, target, isWord){
  const safe = esc(sentence);
  let re;
  if(isWord){
    const stem = target.length > 6 ? target.slice(0, -2) : target;
    re = new RegExp("(\\b" + reEsc(esc(stem)) + "[\\w-]*)", "i");
  } else {
    re = new RegExp("(" + reEsc(esc(target)) + ")", "i");
  }
  return re.test(safe) ? safe.replace(re, "<mark>$1</mark>") : safe;
}

/* Saved list: [{k:"w"|"p", n:name}], newest first */
const getSaved = () => store.get("lexicon:saved") || [];
const isSaved = (k, n) => getSaved().some(s => s.k === k && s.n === n);
function toggleSaved(k, n){
  let list = getSaved();
  if(list.some(s => s.k === k && s.n === n)) list = list.filter(s => !(s.k === k && s.n === n));
  else list.unshift({k, n});
  store.set("lexicon:saved", list);
  updateCount();
  return list.some(s => s.k === k && s.n === n);
}
function updateCount(){
  const n = getSaved().length;
  const el = $("savedCount");
  el.textContent = n;
  el.hidden = n === 0;
  $("savedBtn").setAttribute("aria-label", n ? `Saved, ${n} ${n === 1 ? "item" : "items"}` : "Saved");
}
const WORD_BY = Object.fromEntries(WORDS.map(x => [x[0], x]));
const PHRASE_BY = Object.fromEntries(PHRASES.map(x => [x[0], x]));

function entry(kind, key, head, meta, def, ex, hl, isWord){
  const used = (store.get(key) || {}).used;
  const k = isWord ? "w" : "p";
  const saved = isSaved(k, head);
  return `<section class="entry fade" data-key="${esc(key)}" data-k="${k}" data-n="${esc(head)}">
    <p class="kind">${kind}</p>
    <h2 class="head">${esc(head)}</h2>
    <p class="meta">${meta}</p>
    <p class="def">${esc(def)}</p>
    <blockquote class="example">${highlight(ex, hl, isWord)}</blockquote>
    <div class="actions">
      <button class="copy" data-text="${esc(head)}" data-label="${isWord ? "Copy word" : "Copy phrase"}">${isWord ? "Copy word" : "Copy phrase"}</button>
      <button class="saved" aria-pressed="${saved ? "true" : "false"}">${saved ? "Saved ★" : "Save"}</button>
      <button class="used" aria-pressed="${used ? "true" : "false"}">${used ? "Used it ✓" : "Mark as used"}</button>
    </div>
  </section>`;
}

let view = "day", filter = "all";

function savedItemHTML(s){
  if(s.k === "w"){
    const x = WORD_BY[s.n]; if(!x) return "";
    const [w, p, pos, d, e] = x;
    return `<section class="list-item" data-k="w" data-n="${esc(w)}">
      <p class="kind">Word</p><h2 class="head">${esc(w)}</h2>
      <p class="meta"><em>${POS[pos] || esc(pos)}</em> &nbsp;/&nbsp; ${esc(p)}</p>
      <p class="def">${esc(d)}</p>
      <blockquote class="example">${highlight(e, w, true)}</blockquote>
      <div class="actions"><button class="copy" data-text="${esc(w)}" data-label="Copy word">Copy word</button><button class="remove">Remove</button></div>
    </section>`;
  }
  const x = PHRASE_BY[s.n]; if(!x) return "";
  const [ph, origin, meaning, pex, phl] = x;
  return `<section class="list-item" data-k="p" data-n="${esc(ph)}">
    <p class="kind">Phrase</p><h2 class="head">${esc(ph)}</h2>
    <p class="meta">${esc(origin)}</p>
    <p class="def">${esc(meaning)}</p>
    <blockquote class="example">${highlight(pex, phl || ph, false)}</blockquote>
    <div class="actions"><button class="copy" data-text="${esc(ph)}" data-label="Copy phrase">Copy phrase</button><button class="remove">Remove</button></div>
  </section>`;
}

function renderSaved(){
  view = "saved";
  $("title").textContent = "Saved";
  $("back").hidden = false;
  $("savedBtn").hidden = true;
  $("datebar").hidden = true;
  $("streak").hidden = true;
  const all = getSaved();
  const list = all.filter(s => filter === "all" || s.k === filter);
  const btn = (f, label) => `<button data-filter="${f}" aria-pressed="${filter === f}">${label}</button>`;
  $("main").innerHTML = !all.length
    ? `<p class="empty">Nothing saved yet. Tap Save on a word or phrase to keep it here.</p>`
    : `<div class="filters">${btn("all","All (" + all.length + ")")}${btn("w","Words")}${btn("p","Phrases")}</div>` +
      (list.length ? list.map(savedItemHTML).join("") : `<p class="empty">No saved ${filter === "w" ? "words" : "phrases"} yet.</p>`);
  window.scrollTo(0, 0);
}

function render(){
  view = "day";
  $("title").textContent = "Daily Lexicon";
  $("back").hidden = true;
  $("savedBtn").hidden = false;
  $("datebar").hidden = false;
  updateCount();
  $("streak").hidden = false;
  const n = todayIdx + offset;
  const [w, p, pos, d, e] = WORDS[mod(n, WORDS.length)];
  const [ph, origin, meaning, pex, phl] = PHRASES[mod(n, PHRASES.length)];
  const date = new Date(midnight(new Date()).getTime() + offset * DAY);
  $("date").textContent = offset === 0 ? "Today"
    : offset === -1 ? "Yesterday"
    : date.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
  $("today").hidden = offset === 0;
  $("next").disabled = offset >= 0;
  $("main").innerHTML =
    entry("Word of the day", "u:w:" + w, w, `<em>${POS[pos] || esc(pos)}</em> &nbsp;/&nbsp; ${esc(p)}`, d, e, w, true) +
    entry("Phrase of the day", "u:p:" + ph, ph, esc(origin), meaning, pex, phl || ph, false);
  renderStreak();
}

function renderStreak(){
  let count = 0;
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.startsWith("u:")){ const v = store.get(k); if(v && v.used) count++; }
    }
  }catch(e){}
  const total = WORDS.length + PHRASES.length;
  $("streak").textContent = count
    ? `You’ve put ${count} of ${total} words and phrases to use.`
    : "Use today’s picks in a real conversation, then mark them as used.";
}

$("main").addEventListener("click", ev => {
  const btn = ev.target.closest("button");
  if(!btn) return;
  if(btn.dataset.filter){ filter = btn.dataset.filter; renderSaved(); return; }
  const card = btn.closest("[data-n]");
  const key = card ? card.dataset.key : null;
  if(btn.classList.contains("remove")){
    toggleSaved(card.dataset.k, card.dataset.n);
    renderSaved();
    return;
  }
  if(btn.classList.contains("saved")){
    const on = toggleSaved(card.dataset.k, card.dataset.n);
    btn.setAttribute("aria-pressed", on);
    btn.textContent = on ? "Saved ★" : "Save";
    return;
  }
  if(btn.classList.contains("copy")){
    const txt = btn.dataset.text;
    const label = btn.dataset.label;
    const done = msg => { btn.textContent = msg; setTimeout(() => btn.textContent = label, 1400); };
    if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(() => done("Copied"), () => done("Couldn’t copy")); }
    else done("Couldn’t copy");
  }
  if(btn.classList.contains("used")){
    const saved = store.get(key) || {};
    saved.used = !saved.used;
    store.set(key, saved);
    btn.setAttribute("aria-pressed", saved.used);
    btn.textContent = saved.used ? "Used it ✓" : "Mark as used";
    renderStreak();
  }
});

$("savedBtn").onclick = () => { filter = "all"; renderSaved(); };
$("back").onclick = () => render();
$("prev").onclick = () => { offset--; render(); };
$("next").onclick = () => { if(offset < 0){ offset++; render(); } };
$("today").onclick = () => { offset = 0; render(); };

/* Refresh when the app is reopened on a new day */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && view === "day" && dayIndex(new Date()) !== todayIdx) location.reload();
});
